<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Flat illustration of a developer at a desk with a laptop, a code window showing a Django model, a stack of API servers, a phone running an app and a small analytics chart">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#161f38"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <clipPath id="card"><rect x="0" y="0" width="1200" height="340" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <circle cx="120" cy="20" r="150" fill="#58a6ff" opacity="0.08"/>
    <circle cx="1100" cy="330" r="170" fill="#a371f7" opacity="0.08"/>
    <rect width="1200" height="7" fill="url(#accent)"/>
  </g>

  <g transform="translate(64,74)">

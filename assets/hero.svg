    <circle cx="60" cy="18" r="5" fill="#3fb950"/>
    <text x="84" y="23" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#8b949e">models.py</text>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13.5">
      <text x="20" y="68" fill="#ff7b72">class <tspan fill="#d2a8ff">Post</tspan><tspan fill="#c9d1d9">(models.Model):</tspan></text>
      <text x="36" y="94" fill="#c9d1d9">title = <tspan fill="#79c0ff">CharField</tspan>(...)</text>
      <text x="36" y="120" fill="#c9d1d9">body  = <tspan fill="#79c0ff">TextField</tspan>()</text>
      <text x="20" y="152" fill="#8b949e">@api_view([<tspan fill="#a5d6ff">"GET"</tspan>])</text>
    </g>
    <rect x="20" y="168" width="126" height="8" rx="4" fill="#3fb950" opacity="0.45"/>
    <rect x="154" y="168" width="70" height="8" rx="4" fill="#58a6ff" opacity="0.35"/>
